version: 2

# One weekly pull request per ecosystem for minor/patch updates, and a separate one
# for majors (so a breaking bump never blocks the routine ones). Every merge into
# `development` triggers the per-service deploy workflows, so fewer, larger PRs
# also means fewer deploys.

registries:
  nuget-org:
    type: nuget-feed
    url: https://api.nuget.org/v3/index.json

updates:
  # ─── NuGet packages ────────────────────────────────────────────────────────────
  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - nuget-org
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ─── GitHub Actions ─────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "05:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "area-infrastructure"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "martincostello*"

  # ─── npm/pnpm packages: SPA ──────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/src/WebApps/Shopping.Web.SPA.React"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: "deps(spa)"
    labels:
      - "dependencies"
      - "npm"
    groups:
      spa-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      spa-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ─── npm packages: infra (CDK) ───────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: "deps(infra)"
    labels:
      - "dependencies"
      - "npm"
    groups:
      infra-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      infra-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ─── npm packages: ProductImages service ─────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/src/Services/ProductImages"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: "deps(product-images)"
    labels:
      - "dependencies"
      - "npm"
    groups:
      product-images-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      product-images-major:
        patterns:
          - "*"
        update-types:
          - "major"
