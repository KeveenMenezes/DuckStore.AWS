name: Deploy SPA (SST)

on:
  push:
    branches: [development]
    paths:
      - 'src/WebApps/Shopping.Web.SPA.React/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '24'
  STAGE: dev
  SPA_URL: https://duckstore.dev.keveenmenezes.com

jobs:
  deploy:
    name: Deploy SPA via SST
    runs-on: ubuntu-latest
    environment: development

    defaults:
      run:
        working-directory: src/WebApps/Shopping.Web.SPA.React

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/WebApps/Shopping.Web.SPA.React/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `sst.config.ts` reads AppSync's URL/API key at deploy time via
      # `aws.cloudformation.getExportOutput` for the deployed Lambda's runtime
      # env — but `sst deploy` also runs `pnpm build:opennext` internally
      # (see sst.config.ts's `buildCommand`), and Next.js's SSG/ISR
      # prerendering needs these as real env vars *during that build*, not
      # just wired into the Lambda afterwards. Exporting to $GITHUB_ENV (not
      # $GITHUB_OUTPUT) makes them inherited by every later step, including
      # the `sst deploy` process and the `build:opennext` child process it
      # spawns.
      - name: Fetch AppSync connection info
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name DuckStoreAppSyncStack \
            --query "Stacks[0].Outputs" --output json)
          echo "APPSYNC_URL=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ApiUrl") | .OutputValue')" >> "$GITHUB_ENV"
          echo "APPSYNC_API_KEY=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ApiKey") | .OutputValue')" >> "$GITHUB_ENV"

      - name: Set SST secrets
        run: npx sst secret set WebhookSecret "${{ secrets.WEBHOOK_SECRET }}" --stage ${{ env.STAGE }}

      - name: Deploy
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SPA_URL }}
          GRAPHQL_BACKEND: appsync
        run: npx sst deploy --stage ${{ env.STAGE }}

      - name: Deployment summary
        run: |
          echo "## SPA Deployed via SST" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Stage** | ${{ env.STAGE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **SPA URL** | ${{ env.SPA_URL }} |" >> $GITHUB_STEP_SUMMARY
