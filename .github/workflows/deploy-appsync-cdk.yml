name: Deploy AppSync CDK Stack

on:
  push:
    branches: [development]
    paths:
      - 'infra/**'
      - 'graphql/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Deploy CDK
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Empty federation secrets would deploy Cognito IdPs with blank client secrets
      # (broken social sign-in) — fail fast instead. See docs/one-time-account-setup.md.
      - name: Validate federation secrets
        run: |
          [ -n "${{ secrets.GOOGLE_FEDERATION_CLIENT_SECRET }}" ] || { echo "::error::GOOGLE_FEDERATION_CLIENT_SECRET is empty in this environment"; exit 1; }
          [ -n "${{ secrets.AMAZON_FEDERATION_CLIENT_SECRET }}" ] || { echo "::error::AMAZON_FEDERATION_CLIENT_SECRET is empty in this environment"; exit 1; }

      - name: Deploy AppSync CDK stack
        working-directory: infra
        run: |
          # AppSync imports Lambda ARNs via CloudFormation exports from Basket, Pricing and
          # ProductImages stacks — those must exist before this stack deploys. The --exclusively
          # flag still narrows bundling to this stack only (ADR-0042 §8).
          npx cdk deploy DuckStoreAppSyncStack \
            --exclusively \
            --context spaBaseUrl=${{ vars.SPA_BASE_URL || 'http://localhost:3000' }} \
            --parameters GoogleClientSecret=${{ secrets.GOOGLE_FEDERATION_CLIENT_SECRET }} \
            --parameters AmazonClientSecret=${{ secrets.AMAZON_FEDERATION_CLIENT_SECRET }} \
            --require-approval never

      - name: Deployment summary
        run: |
          echo "## AppSync CDK Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Stack** | DuckStoreAppSyncStack |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **SPA Base URL** | ${{ vars.SPA_BASE_URL || 'http://localhost:3000' }} |" >> $GITHUB_STEP_SUMMARY
