name: Deploy User CDK Stack

on:
  push:
    branches: [development]
    paths:
      - 'infra/**'
      - 'src/Services/User/**'
      - 'src/BuildingBlocks/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Deploy CDK
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy User CDK stack
        working-directory: infra
        run: |
          # --exclusively narrows aws:cdk:bundling-stacks to this stack. Without it the CLI
          # sets it to ["**"] and every stack's assets bundle on every deploy, which means
          # compiling all eight AOT packages here (ADR-0042 §8). Safe because the stacks share
          # nothing through CloudFormation — they import by name.
          npx cdk deploy DuckStoreUserStack \
            --exclusively \
            --require-approval never

      - name: Deployment summary
        run: |
          echo "## User CDK Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Stack** | DuckStoreUserStack |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
