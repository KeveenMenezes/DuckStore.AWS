name: Deploy Product Images CDK Stack

on:
  push:
    branches: [development]
    paths:
      - 'infra/**'
      - 'src/Services/ProductImages/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Deploy CDK
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            src/Services/ProductImages/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      # CDK's NodejsFunction bundles the processor Lambda locally (esbuild, no Docker —
      # ADR-0034): it needs esbuild and the Lambda's own deps (sharp) already installed
      # here, not just in infra/, or bundling fails trying to fetch them mid-build.
      - name: Install ProductImages Lambda dependencies
        working-directory: src/Services/ProductImages
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The processor Lambda is Docker-bundled for arm64 (sharp's native binary must be
      # installed inside an arm64 image — see product-images-stack.ts). This runner is
      # x86_64, so the arm64 bundling image needs QEMU emulation registered or the build
      # fails with "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Deploy Product Images CDK stack
        working-directory: infra
        run: |
          npx cdk deploy DuckStoreProductImagesStack \
            --context deployProductImages=true \
            --require-approval never

      - name: Deployment summary
        run: |
          echo "## Product Images CDK Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Stack** | DuckStoreProductImagesStack |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
