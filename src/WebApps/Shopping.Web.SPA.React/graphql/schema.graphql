# Public types: accessible via API_KEY (no login) and Cognito (authenticated users).
# Private types carry no directive — the default Cognito User Pools auth applies.

type Product @aws_api_key @aws_cognito_user_pools {
  id: ID!
  name: String!
  description: String!
  imageUrl: String!
  price: Float!
  stock: Int!
  categoryIds: [ID!]!
  # Aggregate rating materialized from the Review context via CDC (ADR-0011); 0 when no reviews.
  averageRating: Float!
  ratingCount: Int!
}

type Review @aws_api_key @aws_cognito_user_pools {
  id: ID!
  productId: ID!
  userName: String!
  rating: Int!
  comment: String!
  createdAt: String!
}

type ReviewPage @aws_api_key @aws_cognito_user_pools {
  items: [Review!]!
  nextToken: String
}

type ProductPage @aws_api_key @aws_cognito_user_pools {
  items: [Product!]!
  nextToken: String
}

type Category @aws_api_key @aws_cognito_user_pools {
  id: ID!
  name: String!
  parentId: ID
  path: [ID!]!
}

type CategoryPage @aws_api_key @aws_cognito_user_pools {
  items: [Category!]!
  nextToken: String
}

type CartItem {
  quantity: Int!
  color: String
  price: Float!
  productId: ID!
  productName: String!
}

type ShoppingCart {
  ownerId: String!
  items: [CartItem!]!
  totalPrice: Float!
}

type Coupon {
  productName: String!
  description: String!
  amount: Int!
}

type ShippingAddress {
  firstName: String!
  lastName: String!
  emailAddress: String!
  addressLine: String!
  country: String!
  state: String!
  zipCode: String!
}

type OrderPayment {
  cardName: String!
  cardNumber: String!
  expiration: String!
  cvv: String!
  paymentMethod: Int!
}

type OrderItem {
  productId: ID!
  quantity: Int!
  price: Float!
}

type Order {
  id: ID!
  customerId: ID!
  orderName: String!
  status: String!
  createdAt: String
  shippingAddress: ShippingAddress!
  payment: OrderPayment!
  orderItems: [OrderItem!]!
}

type OrderPage {
  items: [Order!]!
  nextToken: String
}

type DeleteOrderResult {
  isSuccess: Boolean!
}

type StoreBasketResult {
  ownerId: String!
}

type CheckoutResult {
  isSuccess: Boolean!
}

type DeleteBasketResult {
  isSuccess: Boolean!
}

type MergeBasketResult {
  ownerId: String!
}

type CreateProductResult {
  id: ID!
}

type CreateReviewResult {
  id: ID!
}

type UpdateProductResult {
  id: ID!
}

type DeleteProductResult {
  isSuccess: Boolean!
}

input CartItemInput {
  quantity: Int!
  color: String
  price: Float!
  productId: ID!
  productName: String!
}

input ShoppingCartInput {
  items: [CartItemInput!]!
}

input CheckoutInput {
  totalPrice: Float!
  firstName: String!
  lastName: String!
  emailAddress: String!
  addressLine: String!
  country: String!
  state: String!
  zipCode: String!
  cardName: String!
  cardNumber: String!
  expiration: String!
  cvv: String!
  paymentMethod: Int!
}

input CreateProductInput {
  name: String!
  description: String!
  imageUrl: String!
  price: Float!
  stock: Int!
  categoryIds: [ID!]!
}

input UpdateProductInput {
  id: ID!
  name: String!
  description: String!
  imageUrl: String!
  price: Float!
  stock: Int!
  categoryIds: [ID!]!
}

input CreateReviewInput {
  productId: ID!
  userName: String!
  rating: Int!
  comment: String!
}

type Query {
  # Direct DynamoDB resolver — public (API_KEY or Cognito)
  products(pageSize: Int, nextToken: String): ProductPage! @aws_api_key @aws_cognito_user_pools

  # Direct DynamoDB resolver — public (API_KEY or Cognito)
  product(id: ID!): Product @aws_api_key @aws_cognito_user_pools

  # Direct DynamoDB resolver — public (API_KEY or Cognito)
  categories(pageSize: Int, nextToken: String): CategoryPage! @aws_api_key @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito OR API_KEY (guest via BFF). Resolver derives ownerId from
  # ctx.identity (USER#<sub>) or validates the injected GUEST# ownerId (see ADR-0016).
  basket(ownerId: String!): ShoppingCart @aws_api_key @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito required
  couponFor(productName: String!): Coupon

  # Direct DynamoDB resolver — Cognito required; Admin group only (enforced in resolver)
  orders(pageSize: Int, nextToken: String): OrderPage!

  # Direct DynamoDB resolver — Cognito required; Admin group only (enforced in resolver)
  ordersByName(name: String!, pageSize: Int, nextToken: String): OrderPage!

  # Lambda resolver — Cognito required; uses ctx.identity.sub (resolver ignores client customerId)
  ordersByCustomer(customerId: ID!): OrderPage!

  # Direct DynamoDB resolver — public (API_KEY or Cognito)
  reviewsByProduct(productId: ID!, pageSize: Int, nextToken: String): ReviewPage! @aws_api_key @aws_cognito_user_pools
}

type Mutation {
  # Lambda resolver — Cognito OR API_KEY (guest via BFF); resolver derives/validates ownerId (ADR-0016)
  storeBasket(ownerId: String!, input: ShoppingCartInput!): StoreBasketResult! @aws_api_key @aws_cognito_user_pools

  # Lambda resolver — Cognito ONLY (login required, which triggers the merge); resolver injects
  # ctx.identity.sub as CustomerId and USER#<sub> as OwnerId (ADR-0009, ADR-0016)
  checkoutBasket(input: CheckoutInput!): CheckoutResult!

  # Direct DynamoDB resolver — Cognito OR API_KEY (guest via BFF); resolver derives/validates ownerId
  deleteBasket(ownerId: String!): DeleteBasketResult! @aws_api_key @aws_cognito_user_pools

  # Lambda resolver — Cognito ONLY; called by the BFF right after login to merge the guest cart
  # (GUEST#<guestId>) into the authenticated USER#<sub> cart (ADR-0016)
  mergeBasket(guestId: String!): MergeBasketResult!

  # Direct DynamoDB resolver — Cognito required; Admin or Seller group only (enforced in resolver)
  createProduct(input: CreateProductInput!): CreateProductResult!

  # Direct DynamoDB resolver — Cognito required; Admin or Seller group only (enforced in resolver)
  updateProduct(input: UpdateProductInput!): UpdateProductResult!

  # Direct DynamoDB resolver — Cognito required; Admin or Seller group only (enforced in resolver)
  deleteProduct(id: ID!): DeleteProductResult!

  # Lambda resolver — Cognito required; Admin group only (enforced in resolver)
  deleteOrder(orderId: ID!): DeleteOrderResult!

  # Direct DynamoDB resolver — Cognito required; CDC updates product rating (ADR-0011)
  createReview(input: CreateReviewInput!): CreateReviewResult!
}
