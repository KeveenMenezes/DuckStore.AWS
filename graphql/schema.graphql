# Public types: accessible via API_KEY (no login) and Cognito (authenticated users).
# Private types carry no directive — the default Cognito User Pools auth applies.

type Product @aws_api_key @aws_cognito_user_pools {
  id: ID!
  name: String!
  description: String!
  # Metadata only (ADR-0034) — clients build the URL from configuration + imageId.
  # Empty for products created before the image pipeline (render a placeholder).
  images: [ProductImage!]!
  stock: Int!
  categoryIds: [ID!]!
  # Sourced from CatalogView's own DynamoDB table ("catalogview-products"), not Catalog's item
  # (ADR-0030, supersedes ADR-0027/ADR-0011 §4); 0 when no reviews. Kept in sync via
  # CatalogProductSyncEvent/ReviewCreated CDC.
  averageRating: Float!
  ratingCount: Int!
  # Sparse map keyed by rating value (1–5) to count of reviews with that rating, e.g.
  # {"1": 3, "2": 0, "3": 5, "4": 12, "5": 8}. Used to render the rating histogram on
  # product pages without a separate query to reviewsByProduct (ADR-0030).
  ratingDistribution: AWSJSON!
  # Sticker/"De" price, denormalized onto the search document via PriceChangedEvent CDC
  # (ADR-0026/0027) — never discounted, also the ceiling the store subsidizes card-installment
  # fees up to.
  originalPrice: Float!
  # Payment highlights, carried on the same PriceChangedEvent CDC above — cost-derived and, when a
  # campaign is active, already discounted server-side. Recomputed only when the price changes, so
  # a gateway-cost-only or campaign-only change goes stale until then. Scalars only — the detailed
  # per-installment plan is deliberately not denormalized here (see installmentPlanFor) to avoid
  # indexing an array nobody reads off the catalog/card views.
  price: Float!
  cashPrice: Float!
  maxInstallmentsWithoutInterest: Int!
  # The per-installment $ value at maxInstallmentsWithoutInterest — a lone scalar (not the full
  # plan array) so the catalog card can show an exact "up to Nx of $Y" line without pulling the
  # entire per-installment breakdown (see installmentPlanFor for that).
  maxInstallmentValue: Float!
}

# Image metadata only (ADR-0034) — never a URL. Clients build
# {CDN base}/images/{imageId}/{size}.{fmt}; the CDN base comes from configuration.
type ProductImage @aws_api_key @aws_cognito_user_pools {
  imageId: ID!
  isMain: Boolean!
  order: Int!
}

input ProductImageInput {
  imageId: ID!
  isMain: Boolean!
  order: Int!
}

# Per-installment-count entry (count >= 2 — 1x is Product.price itself, so it's omitted here).
type InstallmentOption @aws_api_key @aws_cognito_user_pools {
  count: Int!
  value: Float!
  totalValue: Float!
  hasInterest: Boolean!
}

enum ProductSort {
  RELEVANCE
  AVERAGE_RATING
}

# Nominal price and current discount live in Pricing, not Catalog (ADR-0026) — Product no longer
# carries a price field. CatalogView joins the two via PriceChangedEvent CDC and denormalizes the
# nominal price onto its own DynamoDB item (ADR-0030, supersedes ADR-0027) for display.
type Price @aws_api_key @aws_cognito_user_pools {
  productId: ID!
  nominalPrice: Float!
  cost: Float!
  updatedAt: String!
}

type InstallmentPlan @aws_api_key @aws_cognito_user_pools {
  productId: ID!
  originalPrice: Float!
  price: Float!
  cashPrice: Float!
  maxInstallmentsWithoutInterest: Int!
  installments: [InstallmentOption!]!
}

# Cart-level equivalent of InstallmentPlan: every item's Cost/NominalPrice is summed first (the
# whole cart is billed as a single checkout transaction) and run through the same cost-floor
# calculation, so a mixed-margin cart resolves to one unified plan instead of N per-product ones.
type BasketInstallmentPlan @aws_api_key @aws_cognito_user_pools {
  totalOriginalPrice: Float!
  price: Float!
  cashPrice: Float!
  maxInstallmentsWithoutInterest: Int!
  installments: [InstallmentOption!]!
}

type Campaign @aws_cognito_user_pools {
  id: ID!
  name: String!
  discountType: String!
  value: Float!
  startsAt: String!
  endsAt: String!
  productIds: [ID!]!
}

# One payment-gateway provider's operating costs (ADR-0028): a flat fee per transaction, a
# discount rate for upfront (à vista) payment, and an explicit rate per installment count.
# installmentRates is a sparse map keyed by installment count (e.g. {"1": 3.0, "2": 4.2}).
type GatewayCost @aws_cognito_user_pools {
  provider: String!
  flatFeePerTransaction: Float!
  avistaRatePercent: Float!
  installmentRates: AWSJSON!
}

type Review @aws_api_key @aws_cognito_user_pools {
  id: ID!
  productId: ID!
  userName: String!
  rating: Int!
  comment: String!
  createdAt: String!
  # Set on every write, including the first (ADR-0029) — distinct from createdAt once a customer
  # edits their existing review (same productId+userId upserts in place, createdAt unchanged).
  updatedAt: String!
}

type ReviewPage @aws_api_key @aws_cognito_user_pools {
  items: [Review!]!
  nextToken: String
}

type ProductPage @aws_api_key @aws_cognito_user_pools {
  items: [Product!]!
  nextToken: String
}

type Category @aws_api_key @aws_cognito_user_pools {
  id: ID!
  name: String!
  parentId: ID
  path: [ID!]!
}

type CategoryPage @aws_api_key @aws_cognito_user_pools {
  items: [Category!]!
  nextToken: String
}

# Basket types are returned by dual-auth operations (Cognito OR API_KEY for guests via the BFF),
# so the types themselves must permit both modes or AppSync rejects field access (ADR-0016).
type CartItem @aws_api_key @aws_cognito_user_pools {
  quantity: Int!
  color: String
  price: Float!
  productId: ID!
  productName: String!
  # Snapshot of the product's main imageId at add-to-cart time (ADR-0034) — a key, never
  # a URL. Null for items persisted before the image pipeline (render a placeholder).
  imageId: ID
}

type ShoppingCart @aws_api_key @aws_cognito_user_pools {
  ownerId: String!
  items: [CartItem!]!
  totalPrice: Float!
}

type ShippingAddress @aws_cognito_user_pools {
  firstName: String!
  lastName: String!
  emailAddress: String!
  addressLine: String!
  country: String!
  state: String!
  zipCode: String!
}

type OrderPayment @aws_cognito_user_pools {
  # Null for Cash — no card is collected for that method.
  cardName: String
  cardNumber: String
  expiration: String
  cvv: String
  paymentMethod: Int!
  installments: Int!
}

type OrderItem @aws_cognito_user_pools {
  productId: ID!
  quantity: Int!
  price: Float!
}

type Order @aws_cognito_user_pools {
  id: ID!
  customerId: ID!
  orderName: String!
  status: String!
  createdAt: String
  shippingAddress: ShippingAddress!
  payment: OrderPayment!
  orderItems: [OrderItem!]!
}

type OrderPage @aws_cognito_user_pools {
  items: [Order!]!
  nextToken: String
}

type DeleteOrderResult @aws_cognito_user_pools {
  isSuccess: Boolean!
}

type StoreBasketResult @aws_api_key @aws_cognito_user_pools {
  ownerId: String!
}

type CheckoutResult {
  isSuccess: Boolean!
}

type DeleteBasketResult @aws_api_key @aws_cognito_user_pools {
  isSuccess: Boolean!
}

type MergeBasketResult {
  ownerId: String!
}

type UserProfile {
  userId: ID!
  email: String!
  name: String!
  phone: String
  addressLine: String
  city: String
  state: String
  zipCode: String
  country: String
}

type CreateProductResult @aws_cognito_user_pools {
  id: ID!
}

# One presigned POST per requested upload (ADR-0034). `fields` is the form-field map the
# browser must send back verbatim (policy, signature, key, Content-Type) before the file.
type PresignedImageUpload @aws_cognito_user_pools {
  imageId: ID!
  url: String!
  fields: AWSJSON!
}

input CreateProductImageUploadInput {
  contentTypes: [String!]!
}

type CreateReviewResult {
  id: ID!
  userName: String!
}

type UpdateProductResult @aws_cognito_user_pools {
  id: ID!
}

type DeleteProductResult @aws_cognito_user_pools {
  isSuccess: Boolean!
}

input CartItemInput {
  quantity: Int!
  color: String
  price: Float!
  productId: ID!
  productName: String!
  imageId: ID
}

input ShoppingCartInput {
  items: [CartItemInput!]!
}

input CheckoutInput {
  totalPrice: Float!
  firstName: String!
  lastName: String!
  emailAddress: String!
  addressLine: String!
  country: String!
  state: String!
  zipCode: String!
  # Optional — omitted (or null) when paymentMethod is Cash.
  cardName: String
  cardNumber: String
  expiration: String
  cvv: String
  paymentMethod: Int!
  installments: Int!
}

input BasketInstallmentItemInput {
  productId: ID!
  quantity: Int!
}

input CreateProductInput {
  name: String!
  description: String!
  images: [ProductImageInput!]!
  stock: Int!
  categoryIds: [ID!]!
}

input CreateProductWithPriceInput {
  name: String!
  description: String!
  images: [ProductImageInput!]!
  stock: Int!
  categoryIds: [ID!]!
  price: Float!
  cost: Float!
}

input UpdateProductInput {
  id: ID!
  name: String!
  description: String!
  images: [ProductImageInput!]!
  stock: Int!
  categoryIds: [ID!]!
}

input CreateReviewInput {
  productId: ID!
  rating: Int!
  comment: String!
}

input UpdateProfileInput {
  name: String!
  phone: String
  addressLine: String
  city: String
  state: String
  zipCode: String
  country: String
}

type Query {
  # Direct DynamoDB resolver (ADR-0030, reverses ADR-0027 amends ADR-0009 — CatalogView is
  # DynamoDB-backed again) — Scan + contains() filter, no relevance ranking; sortBy is
  # best-effort (only sorts the current page, see Query.products.js); public (API_KEY or Cognito)
  products(
    query: String
    sortBy: ProductSort
    minRating: Float
    maxRating: Float
    pageSize: Int
    nextToken: String
  ): ProductPage! @aws_api_key @aws_cognito_user_pools

  # Direct DynamoDB resolver (ADR-0030, reverses ADR-0027 amends ADR-0009) — public (API_KEY or Cognito)
  product(id: ID!): Product @aws_api_key @aws_cognito_user_pools

  # Direct DynamoDB resolver — public (API_KEY or Cognito)
  categories(pageSize: Int, nextToken: String): CategoryPage! @aws_api_key @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito OR API_KEY (guest via BFF). Resolver derives ownerId from
  # ctx.identity (USER#<sub>) or validates the injected GUEST# ownerId (see ADR-0016).
  basket(ownerId: String!): ShoppingCart @aws_api_key @aws_cognito_user_pools

  # Direct DynamoDB resolver — public (API_KEY or Cognito); GetItem on Pricing's "prices" table
  nominalPriceFor(productId: ID!): Price @aws_api_key @aws_cognito_user_pools

  # Lambda resolver — public (API_KEY or Cognito); non-trivial calculation, not a key lookup (ADR-0009)
  installmentPlanFor(productId: ID!): InstallmentPlan @aws_api_key @aws_cognito_user_pools

  # Lambda resolver — public (API_KEY or Cognito); sums cost/originalPrice across every cart item
  # first, then runs the same InstallmentCalculator over the whole cart as one transaction (ADR-0009)
  basketInstallmentPlan(items: [BasketInstallmentItemInput!]!): BasketInstallmentPlan @aws_api_key @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito required; Admin group only (enforced in resolver)
  orders(pageSize: Int, nextToken: String): OrderPage! @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito required; Admin group only (enforced in resolver)
  ordersByName(name: String!, pageSize: Int, nextToken: String): OrderPage! @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito required; uses ctx.identity.sub (resolver ignores client customerId)
  ordersByCustomer(customerId: ID!): OrderPage!

  # Direct DynamoDB resolver — Cognito only (default auth); lazily provisions from token claims via
  # if_not_exists (ADR-0009, ADR-0017)
  myProfile: UserProfile!

  # Direct DynamoDB resolver — public (API_KEY or Cognito)
  reviewsByProduct(productId: ID!, pageSize: Int, nextToken: String): ReviewPage! @aws_api_key @aws_cognito_user_pools
}

type Mutation {
  # Direct DynamoDB resolver — Cognito OR API_KEY (guest via BFF); resolver derives/validates
  # ownerId (ADR-0009, ADR-0016)
  storeBasket(ownerId: String!, input: ShoppingCartInput!): StoreBasketResult! @aws_api_key @aws_cognito_user_pools

  # Lambda resolver — Cognito ONLY (login required, which triggers the merge); resolver injects
  # ctx.identity.sub as CustomerId and USER#<sub> as OwnerId (ADR-0009, ADR-0016)
  checkoutBasket(input: CheckoutInput!): CheckoutResult!

  # Direct DynamoDB resolver — Cognito OR API_KEY (guest via BFF); resolver derives/validates ownerId
  deleteBasket(ownerId: String!): DeleteBasketResult! @aws_api_key @aws_cognito_user_pools

  # Lambda resolver — Cognito ONLY; called by the BFF right after login to merge the guest cart
  # (GUEST#<guestId>) into the authenticated USER#<sub> cart (ADR-0016)
  mergeBasket(guestId: String!): MergeBasketResult!

  # Lambda resolver — Cognito required; Admin or Seller group only (enforced in resolver).
  # Issues batch presigned POSTs for direct browser->S3 uploads (ADR-0034); Lambda is a
  # justified ADR-0009 escalation — SigV4 signing is impossible in APPSYNC_JS.
  createProductImageUpload(input: CreateProductImageUploadInput!): [PresignedImageUpload!]! @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito required; Admin or Seller group only (enforced in resolver)
  createProduct(input: CreateProductInput!): CreateProductResult! @aws_cognito_user_pools

  # HTTP resolver — Step Functions Express saga via StartSyncExecution (ADR-0032): creates the
  # Catalog product and its Pricing nominal price in one call, compensating (deleting the product)
  # if the price write fails. Cognito required; Admin or Seller group only (enforced in resolver).
  createProductWithPrice(input: CreateProductWithPriceInput!): CreateProductResult! @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito required; Admin or Seller group only (enforced in resolver)
  updateProduct(input: UpdateProductInput!): UpdateProductResult! @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito required; Admin or Seller group only (enforced in resolver)
  deleteProduct(id: ID!): DeleteProductResult! @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito required; Admin or Seller group only. Sets/updates the
  # nominal price, decoupled from createProduct/updateProduct (ADR-0009, ADR-0026).
  setNominalPrice(productId: ID!, price: Float!, cost: Float!): Price! @aws_cognito_user_pools

  # Lambda resolver — Cognito required; Admin group only. Fans out a TransactWriteItems across
  # campaigns + product-discounts (ADR-0026).
  createCampaign(name: String!, discountType: String!, value: Float!, startsAt: String!, endsAt: String!, productIds: [ID!]!): Campaign! @aws_cognito_user_pools

  # Lambda resolver — Cognito required; Admin group only.
  endCampaign(campaignId: ID!): Boolean! @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito required; Admin group only. Configures a payment-gateway
  # provider's flat fee, à vista rate, and per-installment-count rate table (ADR-0009, ADR-0028).
  setGatewayCost(
    provider: String!
    flatFeePerTransaction: Float!
    avistaRatePercent: Float!
    installmentRates: AWSJSON!
  ): GatewayCost! @aws_cognito_user_pools

  # Direct DynamoDB resolver — Cognito required; Admin group only (enforced in resolver)
  deleteOrder(orderId: ID!): DeleteOrderResult! @aws_cognito_user_pools

  # Direct DynamoDB pipeline resolver — Cognito required; upserts by (productId, ctx.identity.sub)
  # so a customer has exactly one active review per product, and the key can't be spoofed via
  # client input; CDC updates product rating (ADR-0011 for new reviews, ADR-0029 for edits)
  createReview(input: CreateReviewInput!): CreateReviewResult!

  # Direct DynamoDB resolver — Cognito only (default auth); UpdateItem keyed by ctx.identity.sub (ADR-0017)
  updateProfile(input: UpdateProfileInput!): UserProfile!
}
